<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mundo Kositas · Acceso</title>
<style>
:root{--verde:#2f7d4f;--verde-osc:#245f3c;--gris:#6b7280;--bg:#f4f6f5;--card:#fff;--borde:#e2e5e3;--texto:#222}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto)}
header{background:var(--verde);color:#fff;padding:10px 16px;font-weight:700;font-size:1.1rem}
.card{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:20px;max-width:380px;margin:60px auto;text-align:center}
@media(max-width:600px){.card{margin:30px 16px;padding:14px}}
#logo{display:none;max-height:64px;max-width:220px;object-fit:contain;margin:0 auto 12px}
h1{font-size:1.4rem;margin:0 0 4px}
p{margin:0 0 18px;color:var(--gris);font-size:.9rem}
a{display:block;padding:12px 14px;margin:10px 0;border-radius:6px;text-decoration:none;font-weight:600;font-size:.95rem}
.p{background:var(--verde);color:#fff}.p:hover{background:var(--verde-osc)}
.s{background:#fff;color:var(--verde);border:1px solid var(--verde)}
</style></head><body>
<header>Mundo Kositas</header>
<div class="card">
  <img id="logo" alt="">
  <h1>Bienvenido</h1>
  <p>Elige a dónde quieres entrar</p>
  <a class="p" href="pos.html">🧾 Entrar al POS (caja)</a>
  <a class="s" href="admin.html">⚙️ Entrar al Admin</a>
</div>
<script>
var l=document.getElementById('logo');
l.addEventListener('load',function(){l.style.display='block'});
l.addEventListener('error',function(){l.style.display='none'});
l.src='https://vsfzkktmdwqkfbecmfcj.supabase.co/storage/v1/object/public/empresa/logo.png';
</script>
</body></html>
